name: Validate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          file_or_dir: ".github/workflows configs .yamllint.yml"

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh tests/*.sh

      - name: Run ShellCheck
        run: |
          shellcheck scripts/*.sh tests/*.sh

      - name: Test terminal color behavior
        run: |
          bash tests/check-status-color.sh

      - name: Test maintenance tool updater
        run: |
          bash tests/update-tools.sh
