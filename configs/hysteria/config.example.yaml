# Hysteria2 Server Configuration Example
#
# Replace:
#   YOUR_DOMAIN
#   YOUR_PASSWORD
#
# before deployment.

# Listen address
listen: :443

# TLS certificate
#
# Certificates are generated by Let's Encrypt
# and managed by Certbot.

tls:
  cert: /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
  key: /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

# Authentication

auth:
  type: password
  password: YOUR_PASSWORD

# Traffic camouflage
#
# Forward invalid HTTP requests to a normal website.
# This helps make the server behave like a normal HTTPS service.

masquerade:
  type: proxy
  proxy:
    url: https://www.apple.com
    rewriteHost: true
